name: Feature request
description: Suggest an idea for LumoCraft
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the launcher cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts
        - Versions
        - Java runtime
        - Launch
        - Loaders
        - Input / controls
        - Performance
        - Diagnostics
        - Updates
        - Other
