name: Build Debug APK

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumocraft-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify (tests, lint, versioning)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Check required config files exist
        run: |
          for f in gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties \
                   app/src/main/AndroidManifest.xml app/src/main/baseline-prof.txt; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
          echo "All required config files present."

      - name: Validate automated versioning
        run: |
          NAME="$(./gradlew -q printVersionName --no-daemon)"
          CODE="$(./gradlew -q printVersionCode --no-daemon)"
          echo "versionName=$NAME versionCode=$CODE"
          echo "$NAME" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "versionName '$NAME' is not a valid SemVer string"; exit 1; }
          [ "$CODE" -gt 0 ] 2>/dev/null || { echo "versionCode '$CODE' is not a positive integer"; exit 1; }

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace --no-daemon