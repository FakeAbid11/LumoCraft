name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # versionName is computed at build time; ask Gradle for it.
            VERSION_NAME="$(./gradlew -q printVersionName --no-daemon)"
            TAG="v${VERSION_NAME}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "Tag '${TAG}' is not a semver tag; refusing to release."
              exit 1
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/lumocraft-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lumocraft-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No keystore secret found; release will fall back to the debug key."
          fi

      - name: Build release APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon
          test -s app/build/outputs/apk/release/app-release.apk \
            || { echo "Release APK is missing or empty"; exit 1; }
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Verify APK integrity
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          # Zip structure must be intact.
          unzip -t app-release.apk > /dev/null
          # Signature must verify (apksigner lives in $ANDROID_HOME/build-tools/*/).
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "${APKSIGNER}" ]; then
            "${APKSIGNER}" verify --verbose app-release.apk
          else
            echo "apksigner not found under \$ANDROID_HOME/build-tools; skipping signature check."
          fi
          sha256sum app-release.apk > app-release.apk.sha256
          sha256sum -c app-release.apk.sha256

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          PREV_TAG="$(git tag --sort=-v:refname | sed -n '2p' || true)"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "## What's changed"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "\`$(git log --oneline "${PREV_TAG}"..HEAD | wc -l)\` commits since ${PREV_TAG}:"
              echo ""
              git log --oneline --no-merges "${PREV_TAG}"..HEAD | sed 's/^/- /'
            else
              git log --oneline --no-merges | head -n 40 | sed 's/^/- /'
            fi
            echo ""
            echo "## Install"
            echo "- Download \`app-release.apk\` and allow \`Install unknown apps\` for your browser/file manager."
            echo "- Verify the checksum in \`app-release.apk.sha256\`."
          } > "$NOTES_FILE"
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumocraft-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE=false
          case "${TAG}" in
            *-rc*|*-beta*|*-alpha*|*-snapshot*|*-preview*) PRERELEASE=true ;;
          esac
          gh release create "${TAG}" \
            --title "${TAG}" \
            --prerelease="${PRERELEASE}" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release.apk.sha256